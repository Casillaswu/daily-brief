# Betroia 渠道日报 —— Cloudflare Pages（静态页 + Pages Functions）
# 部署：bash deploy.sh（照游戏盈亏分析台的做法，只用 R2，不用 D1）
name = "betroia-daily"
pages_build_output_dir = "./public"
compatibility_date = "2026-06-01"

# 单一 R2 存储桶：
#   raw/<时间>_<档名>      原始上传档（CSV / xlsx）永久存档
#   days/YYYY-MM-DD.json  解析后的每日渠道数据（同一天重传 = 覆盖）
[[r2_buckets]]
binding = "RAW"
bucket_name = "betroia-daily-raw"
